# external_values.yaml
# Single source of truth for all published baseline metrics and dataset facts.
# Every numeric claim in the manuscript must reference an entry here.
# DO NOT edit values without updating the source citation.
# Seeded Stage 1: October 2026 (published baselines)
# Updated Stage 2: October 2026 (cohort facts and dataset specifications)
# synthetic: false (all values sourced from official codebooks and published data descriptors)

meta:
  project: "nhanes-eeg-cogdecline-lstm-llm"
  stage_seeded: 2
  date_seeded: "2026-10-27"
  synthetic: false

baselines:

  # ── NHANES-based cognitive prediction (Sakal et al. 2024, npj Aging) ──────
  sakal_2024_nhanes_auc_processing_speed:
    value: 0.82
    comparator: ">="
    metric: "AUC"
    task: "Processing speed and attention prediction (older adults)"
    dataset: "NHANES (accelerometer + sleep features)"
    n: ">2400"
    model: "CatBoost / XGBoost / Random Forest"
    source: "Sakal et al. 2024, npj Aging"
    doi: "10.1038/s41514-024-00177-x"
    notes: "Reported as AUC >= 0.82 for processing speed and attention domains"

  sakal_2024_nhanes_auc_recall:
    value: 0.72
    comparator: "~"
    metric: "AUC"
    task: "Recall / memory prediction (CERAD word-list)"
    dataset: "NHANES (accelerometer + sleep features)"
    n: ">2400"
    model: "CatBoost / XGBoost / Random Forest"
    source: "Sakal et al. 2024, npj Aging"
    doi: "10.1038/s41514-024-00177-x"
    notes: "Approximate value ~0.72; memory domain is harder to predict than processing speed"

  # ── Sleep-EDF staging baselines ──────────────────────────────────────────
