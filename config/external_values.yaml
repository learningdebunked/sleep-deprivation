    metric: "Cohen's kappa"
    task: "5-class sleep staging"
    dataset: "Sleep-EDF Expanded"
    model: "SSNet (end-to-end CNN + LSTM)"
    source: "Almutairi et al. 2023, SSNet preprint"
    doi: null
    url: "https://scispace.com/papers/24n8tj35"

  samaee_2025_sleep_edf_accuracy:
